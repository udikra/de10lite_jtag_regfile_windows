[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "de10lite-jtag-regfile"
version = "0.1.0"
description = "Direct Python access to a DE10-Lite 16x32 JTAG register file"
requires-python = ">=3.9"
dependencies = [
    "pyusb==1.2.1",
    "libusb-package==1.0.30.0",
]

[tool.setuptools]
packages = ["regfile"]
py-modules = ["usb_blaster"]